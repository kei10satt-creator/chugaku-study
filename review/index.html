<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:auto;padding:18px 16px 120px;background:#f6f6f4;color:#181818}h1{font-size:22px}.sub{color:#666}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}.meta{font-size:13px;color:#666}.q{font-size:20px;font-weight:700;margin:10px 0}.ans{font-weight:700;margin-top:12px}.exp{line-height:1.7;white-space:pre-line}.diagram{margin:12px auto;max-width:380px}.diagram svg{width:100%;height:auto}.rate{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(8px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;border-top:1px solid #ddd}button{font-size:16px;padding:12px 16px;border-radius:12px;border:1px solid #bbb;background:white}button.ok{background:#eef8ef}button.tri{background:#fff7df}button.ng{background:#fff0f0}.nav{display:flex;gap:8px;justify-content:space-between;align-items:center}select{font-size:16px;padding:8px}.done{font-weight:700}textarea{width:100%;box-sizing:border-box;min-height:70px;margin-top:10px}</style></head>
<body><h1>LEVEL 1 △❌ 修正版チェック</h1><div class="sub">前回の△18問＋❌27問だけを再チェックします（45問）。⭕️にした255問は表示しません。</div>
<div id="stats" class="card"></div><div id="main"></div>
<div class="rate"><button class="ok" onclick="rate('ok')">⭕️ OK</button><button class="tri" onclick="rate('tri')">△ 改善</button><button class="ng" onclick="rate('ng')">❌ 誤り</button></div>
<script>
const qs=[{"no": 1, "id": "q001", "subject": "国語", "unit": "漢字", "question": "「顕著」の読みとして正しいものはどれ？", "answer": "けんちょ", "explanation": "「顕著（けんちょ）」は、はっきりと目立っていること。例：『努力の成果が顕著に表れた』＝成果がはっきり目立って表れた。", "rating": "", "reasons": "", "comment": ""}, {"no": 2, "id": "q002", "subject": "国語", "unit": "漢字", "question": "「懸命」の読みとして正しいものはどれ？", "answer": "けんめい", "explanation": "「懸命（けんめい）」は、力の限り一生懸命に取り組むこと。例：『懸命に走る』＝全力で走る。", "rating": "", "reasons": "", "comment": ""}, {"no": 3, "id": "q003", "subject": "国語", "unit": "漢字", "question": "「促進」の読みとして正しいものはどれ？", "answer": "そくしん", "explanation": "「促進（そくしん）」は、物事が早く進むようにうながすこと。例：『成長を促進する』＝成長をより進ませる。", "rating": "", "reasons": "", "comment": ""}, {"no": 5, "id": "q005", "subject": "国語", "unit": "漢字", "question": "「尊重」の読みとして正しいものはどれ？", "answer": "そんちょう", "explanation": "「尊重（そんちょう）」は、価値のあるものとして大切に扱うこと。例：『相手の意見を尊重する』＝相手の意見を大切にする。", "rating": "", "reasons": "", "comment": ""}, {"no": 6, "id": "q006", "subject": "国語", "unit": "漢字", "question": "「模索」の読みとして正しいものはどれ？", "answer": "もさく", "explanation": "「模索（もさく）」は、手探りで方法や答えを探すこと。例：『解決策を模索する』＝よい解決策を探し続ける。", "rating": "", "reasons": "", "comment": ""}, {"no": 7, "id": "q007", "subject": "国語", "unit": "漢字", "question": "「柔軟」の読みとして正しいものはどれ？", "answer": "じゅうなん", "explanation": "「柔軟（じゅうなん）」は、やわらかく、状況に応じて考え方や対応を変えられること。例：『柔軟に対応する』。", "rating": "", "reasons": "", "comment": ""}, {"no": 8, "id": "q008", "subject": "国語", "unit": "漢字", "question": "「貢献」の読みとして正しいものはどれ？", "answer": "こうけん", "explanation": "「貢献（こうけん）」は、あることのために力を尽くし、役に立つこと。例：『地域に貢献する』＝地域のために役立つ。", "rating": "", "reasons": "", "comment": ""}, {"no": 9, "id": "q009", "subject": "国語", "unit": "漢字", "question": "「把握」の読みとして正しいものはどれ？", "answer": "はあく", "explanation": "「把握（はあく）」は、内容や状況をしっかり理解すること。例：『状況を把握する』＝今どうなっているかを理解する。", "rating": "", "reasons": "", "comment": ""}, {"no": 10, "id": "q010", "subject": "国語", "unit": "漢字", "question": "「端的」の読みとして正しいものはどれ？", "answer": "たんてき", "explanation": "「端的（たんてき）」は、要点をはっきりと簡潔に表すさま。例：『端的に説明する』＝要点をしぼって分かりやすく説明する。", "rating": "", "reasons": "", "comment": ""}, {"no": 11, "id": "q011", "subject": "国語", "unit": "漢字", "question": "「憂慮」の読みとして正しいものはどれ？", "answer": "ゆうりょ", "explanation": "「憂慮（ゆうりょ）」は、悪いことが起こらないか心配すること。例：『事態を憂慮する』＝今後の成り行きを心配する。", "rating": "", "reasons": "", "comment": ""}, {"no": 12, "id": "q012", "subject": "国語", "unit": "漢字", "question": "「遂行」の読みとして正しいものはどれ？", "answer": "すいこう", "explanation": "「遂行（すいこう）」は、仕事や任務を最後までやりとげること。例：『任務を遂行する』＝任務を最後まで実行する。", "rating": "", "reasons": "", "comment": ""}, {"no": 13, "id": "q013", "subject": "国語", "unit": "漢字", "question": "「吟味」の読みとして正しいものはどれ？", "answer": "ぎんみ", "explanation": "「吟味（ぎんみ）」は、内容をよく調べ、詳しく検討すること。例：『材料を吟味する』＝材料をよく調べて選ぶ。", "rating": "", "reasons": "", "comment": ""}, {"no": 14, "id": "q014", "subject": "国語", "unit": "漢字", "question": "「精緻」の読みとして正しいものはどれ？", "answer": "せいち", "explanation": "「精緻（せいち）」は、非常に細かく、よくできていること。例：『精緻な模型』＝細部まで精密に作られた模型。", "rating": "", "reasons": "", "comment": ""}, {"no": 15, "id": "q015", "subject": "国語", "unit": "漢字", "question": "「踏襲」の読みとして正しいものはどれ？", "answer": "とうしゅう", "explanation": "「踏襲（とうしゅう）」は、以前からのやり方・考え方を受け継いで、そのまま行うこと。例：『従来の方式を踏襲する』。", "rating": "", "reasons": "", "comment": ""}, {"no": 39, "id": "q039", "subject": "国語", "unit": "文法", "question": "「この本」の「この」の品詞は？", "answer": "連体詞", "explanation": "「この」は名詞「本」を直接修飾する連体詞。", "rating": "", "reasons": "", "comment": ""}, {"no": 99, "id": "q099", "subject": "数学", "unit": "関数・図形・資料", "question": "円周角は同じ弧に対する中心角の何倍？", "answer": "1/2", "explanation": "同じ弧ABを見るとき、円の中心Oでできる∠AOBが「中心角」、円周上の点Pでできる∠APBが「円周角」。同じ弧に対して、円周角は中心角の1/2になる。", "rating": "", "reasons": "", "comment": ""}, {"no": 108, "id": "q108", "subject": "数学", "unit": "関数・図形・資料", "question": "平行線にできる錯角の大きさは？", "answer": "等しい", "explanation": "2本の平行線を別の直線が横切るとき、「Z」の形の内側で向かい合う角を錯角という。平行線では、この2つの錯角の大きさは等しい。", "rating": "", "reasons": "", "comment": ""}, {"no": 141, "id": "q141", "subject": "英語", "unit": "熟語", "question": "「in order to」の意味は？", "answer": "〜するために", "explanation": "in order to + 動詞の原形 ＝「〜するために」。目的を表す。例：I study hard in order to pass the exam. ＝ 私は試験に合格するために一生懸命勉強する。", "rating": "", "reasons": "", "comment": ""}, {"no": 142, "id": "q142", "subject": "英語", "unit": "熟語", "question": "「for example」の意味は？", "answer": "例えば", "explanation": "for example ＝「例えば」。具体例を挙げるときに使う。例：I like sports, for example, soccer. ＝ 私はスポーツ、例えばサッカーが好きです。", "rating": "", "reasons": "", "comment": ""}, {"no": 143, "id": "q143", "subject": "英語", "unit": "熟語", "question": "「at first」の意味は？", "answer": "最初は", "explanation": "at first ＝「最初は・初めは」。後で状況が変わったことを述べるときによく使う。例：At first, I was nervous. ＝ 最初は緊張していました。", "rating": "", "reasons": "", "comment": ""}, {"no": 144, "id": "q144", "subject": "英語", "unit": "熟語", "question": "「each other」の意味は？", "answer": "お互いに", "explanation": "each other ＝「お互いに」。2人以上が互いに同じ動作をすることを表す。例：We help each other. ＝ 私たちはお互いに助け合います。", "rating": "", "reasons": "", "comment": ""}, {"no": 145, "id": "q145", "subject": "英語", "unit": "熟語", "question": "「one of the」の意味は？", "answer": "〜のうちの1つ", "explanation": "one of the + 複数名詞 ＝「〜のうちの1つ（1人）」。例：This is one of the best books. ＝ これは最もよい本の1冊です。one of の後ろは複数形になる。", "rating": "", "reasons": "", "comment": ""}, {"no": 146, "id": "q146", "subject": "英語", "unit": "文法", "question": "I ___ soccer every Sunday.", "answer": "play", "explanation": "every Sunday「毎週日曜日」は習慣なので現在形。主語 I では動詞は原形 play。I play soccer every Sunday. ＝ 私は毎週日曜日にサッカーをします。", "rating": "", "reasons": "", "comment": ""}, {"no": 147, "id": "q147", "subject": "英語", "unit": "文法", "question": "She ___ to school by bike every day.", "answer": "goes", "explanation": "every day は習慣を表すので現在形。主語 She は3人称単数だから go → goes。She goes to school by bike every day. ＝ 彼女は毎日自転車で学校へ行きます。", "rating": "", "reasons": "", "comment": ""}, {"no": 148, "id": "q148", "subject": "英語", "unit": "文法", "question": "We ___ dinner now.", "answer": "are eating", "explanation": "now「今」は現在進行形の目印。現在進行形は be動詞 + 動詞ing。主語 We なので are eating。We are eating dinner now. ＝ 私たちは今夕食を食べています。", "rating": "", "reasons": "", "comment": ""}, {"no": 149, "id": "q149", "subject": "英語", "unit": "文法", "question": "He ___ Kyoto last year.", "answer": "visited", "explanation": "last year「昨年」は過去を表すので過去形。visit の過去形は visited。He visited Kyoto last year. ＝ 彼は昨年京都を訪れました。", "rating": "", "reasons": "", "comment": ""}, {"no": 150, "id": "q150", "subject": "英語", "unit": "文法", "question": "I have ___ this movie before.", "answer": "seen", "explanation": "have + 過去分詞は現在完了。see の過去分詞は seen。before と組み合わせて経験を表し、I have seen this movie before. ＝ 私は以前この映画を見たことがあります。", "rating": "", "reasons": "", "comment": ""}, {"no": 151, "id": "q151", "subject": "英語", "unit": "文法", "question": "This book ___ by many students.", "answer": "is read", "explanation": "「この本は多くの生徒に読まれる」なので受け身。受け身は be動詞 + 過去分詞。主語 This book は単数なので is read。read の過去分詞は綴りは同じ read。", "rating": "", "reasons": "", "comment": ""}, {"no": 152, "id": "q152", "subject": "英語", "unit": "文法", "question": "If it ___ tomorrow, we will stay home.", "answer": "rains", "explanation": "if が「もし〜なら」と条件を表すとき、未来のことでも if 節の中は現在形を使う。主語 it は3人称単数なので rains。If it rains tomorrow, we will stay home.", "rating": "", "reasons": "", "comment": ""}, {"no": 153, "id": "q153", "subject": "英語", "unit": "文法", "question": "I want ___ a doctor.", "answer": "to be", "explanation": "want to + 動詞の原形 ＝「〜したい」。be a doctor ＝「医者である」なので to be。I want to be a doctor. ＝ 私は医者になりたい。", "rating": "", "reasons": "", "comment": ""}, {"no": 154, "id": "q154", "subject": "英語", "unit": "文法", "question": "She enjoys ___ music.", "answer": "listening to", "explanation": "enjoy の後ろは動名詞（動詞ing）。listen は「〜を聞く」のとき listen to ～ なので listening to。She enjoys listening to music. ＝ 彼女は音楽を聴くことを楽しみます。", "rating": "", "reasons": "", "comment": ""}, {"no": 155, "id": "q155", "subject": "英語", "unit": "文法", "question": "The boy ___ is running is my brother.", "answer": "who", "explanation": "先行詞 The boy は人で、後ろの is running がその人を説明しているので関係代名詞 who。The boy who is running is my brother. ＝ 走っている少年は私の弟（兄）です。", "rating": "", "reasons": "", "comment": ""}, {"no": 156, "id": "q156", "subject": "英語", "unit": "文法", "question": "This is the book ___ I bought yesterday.", "answer": "that", "explanation": "先行詞 the book は物。I bought ___ yesterday の目的語になる関係代名詞として that を使える。This is the book that I bought yesterday. ＝ これは私が昨日買った本です。", "rating": "", "reasons": "", "comment": ""}, {"no": 157, "id": "q157", "subject": "英語", "unit": "文法", "question": "Mt. Fuji is ___ than Mt. Tsukuba.", "answer": "higher", "explanation": "than があるので比較級。「富士山は筑波山より高い」。high の比較級は higher。Mt. Fuji is higher than Mt. Tsukuba.", "rating": "", "reasons": "", "comment": ""}, {"no": 158, "id": "q158", "subject": "英語", "unit": "文法", "question": "This is the ___ building in the city.", "answer": "tallest", "explanation": "in the city「市内で」と範囲の中で最も高いものを表すので最上級。tall → taller → tallest。This is the tallest building in the city. ＝ これは市内で最も高い建物です。", "rating": "", "reasons": "", "comment": ""}, {"no": 159, "id": "q159", "subject": "英語", "unit": "文法", "question": "You ___ finish your homework today.", "answer": "must", "explanation": "must + 動詞の原形 ＝「〜しなければならない」。finish は動詞の原形なので must。You must finish your homework today. ＝ あなたは今日、宿題を終えなければなりません。", "rating": "", "reasons": "", "comment": ""}, {"no": 160, "id": "q160", "subject": "英語", "unit": "文法", "question": "___ you ever been to Osaka?", "answer": "Have", "explanation": "ever「今までに」と been to「〜へ行ったことがある」から現在完了の経験。現在完了は have/has + 過去分詞。主語 you なので Have。Have you ever been to Osaka? ＝ 大阪へ行ったことがありますか。", "rating": "", "reasons": "", "comment": ""}, {"no": 161, "id": "q161", "subject": "英語", "unit": "文法", "question": "How long have you ___ here?", "answer": "lived", "explanation": "How long + 現在完了 ＝「どのくらいの間〜していますか」。have + 過去分詞なので live → lived。How long have you lived here? ＝ ここにどのくらい住んでいますか。", "rating": "", "reasons": "", "comment": ""}, {"no": 162, "id": "q162", "subject": "英語", "unit": "文法", "question": "I was tired, ___ I went to bed early.", "answer": "so", "explanation": "「疲れていた。その結果、早く寝た」という原因→結果なので so「だから」。I was tired, so I went to bed early. ＝ 疲れていたので、早く寝ました。", "rating": "", "reasons": "", "comment": ""}, {"no": 163, "id": "q163", "subject": "英語", "unit": "文法", "question": "He can speak English ___ Japanese.", "answer": "and", "explanation": "English と Japanese を並べて「英語と日本語」とするので and。He can speak English and Japanese. ＝ 彼は英語と日本語を話すことができます。", "rating": "", "reasons": "", "comment": ""}, {"no": 164, "id": "q164", "subject": "英語", "unit": "文法", "question": "There ___ two books on the desk.", "answer": "are", "explanation": "There is/are ～ ＝「〜があります・います」。後ろの主語 two books は複数なので are。There are two books on the desk. ＝ 机の上に本が2冊あります。", "rating": "", "reasons": "", "comment": ""}, {"no": 165, "id": "q165", "subject": "英語", "unit": "文法", "question": "There ___ a pen on the desk.", "answer": "is", "explanation": "There is/are ～ では、後ろの主語が単数なら is。a pen は単数なので There is a pen on the desk. ＝ 机の上にペンが1本あります。", "rating": "", "reasons": "", "comment": ""}, {"no": 167, "id": "q167", "subject": "英語", "unit": "読解・表現", "question": "“Could you help me?” に対する自然な返答は？", "answer": "Sure.", "explanation": "Could you help me? ＝「手伝っていただけますか」。依頼を引き受ける自然な返答は Sure. ＝「もちろん／いいですよ」。", "rating": "", "reasons": "", "comment": ""}, {"no": 168, "id": "q168", "subject": "英語", "unit": "読解・表現", "question": "“What do you think of this idea?” の意味は？", "answer": "この考えをどう思いますか", "explanation": "What do you think of ～? ＝「〜をどう思いますか」。相手の意見・感想をたずねる表現。What do you think of this idea? ＝「この考えをどう思いますか」。", "rating": "", "reasons": "", "comment": ""}, {"no": 191, "id": "q191", "subject": "理科", "unit": "化学", "question": "水を電気分解したとき発生する気体は？", "answer": "水素と酸素", "explanation": "水は H₂O（水素原子2個と酸素原子1個からなる物質）。電気分解すると水素H₂と酸素O₂に分かれる。反応式は 2H₂O → 2H₂ + O₂ なので、発生する気体の体積比は 水素：酸素＝2：1。", "rating": "", "reasons": "", "comment": ""}]; const KEY='kokoQuizLevel1RecheckV01'; let saved=JSON.parse(localStorage.getItem(KEY)||'{}'); let pos=0;
const diagrams={q099:`<svg viewBox="0 0 300 210" aria-label="中心角と円周角の図"><circle cx="150" cy="105" r="82" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="150" cy="105" r="3" fill="currentColor"/><text x="158" y="108">O</text><circle cx="91" cy="162" r="3"/><text x="76" y="180">A</text><circle cx="209" cy="162" r="3"/><text x="215" y="180">B</text><circle cx="150" cy="23" r="3"/><text x="157" y="20">P</text><line x1="150" y1="105" x2="91" y2="162" stroke="currentColor" stroke-width="2"/><line x1="150" y1="105" x2="209" y2="162" stroke="currentColor" stroke-width="2"/><line x1="150" y1="23" x2="91" y2="162" stroke="currentColor" stroke-width="2"/><line x1="150" y1="23" x2="209" y2="162" stroke="currentColor" stroke-width="2"/><text x="126" y="142">中心角</text><text x="158" y="52">円周角</text></svg>`,q108:`<svg viewBox="0 0 300 190" aria-label="錯角の図"><line x1="30" y1="55" x2="270" y2="55" stroke="currentColor" stroke-width="3"/><line x1="30" y1="135" x2="270" y2="135" stroke="currentColor" stroke-width="3"/><line x1="90" y1="15" x2="205" y2="175" stroke="currentColor" stroke-width="3"/><text x="18" y="48">平行</text><text x="18" y="128">平行</text><path d="M124 55 A28 28 0 0 1 140 77" fill="none" stroke="currentColor" stroke-width="4"/><path d="M171 113 A28 28 0 0 1 187 135" fill="none" stroke="currentColor" stroke-width="4"/><text x="132" y="91">①</text><text x="177" y="111">②</text><text x="95" y="184">①＝②（錯角）</text></svg>`};
function render(){
 let x=qs[pos], s=saved[x.id]||{}; let done=Object.keys(saved).filter(k=>saved[k].rating).length;
 document.getElementById('stats').innerHTML=`<b>${done} / ${qs.length} 再チェック済み</b>`;
 document.getElementById('main').innerHTML=`<div class="card"><div class="meta">元Q${String(x.no).padStart(3,'0')} ｜ ${x.subject} ｜ ${x.unit} ｜ ${pos+1}/${qs.length}</div><div class="q">${esc(x.question)}</div><div class="ans">正解：${esc(x.answer)}</div>${diagrams[x.id]?`<div class="diagram">${diagrams[x.id]}</div>`:''}<hr><div class="exp">${esc(x.explanation)}</div><textarea id="comment" placeholder="まだ気になる点があればメモ">${esc(s.comment||'')}</textarea></div><div class="nav"><button onclick="prev()">← 前</button><select onchange="pos=this.selectedIndex;render()">${qs.map((q,i)=>`<option ${i==pos?'selected':''}>Q${String(q.no).padStart(3,'0')} ${saved[q.id]?.rating==='ok'?'⭕️':saved[q.id]?.rating==='tri'?'△':saved[q.id]?.rating==='ng'?'❌':''}</option>`).join('')}</select><button onclick="next()">次 →</button></div><div class="card"><button onclick="exportJson()">結果JSONを書き出す</button></div>`;
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rate(v){saved[qs[pos].id]={rating:v,comment:document.getElementById('comment').value,originalNo:qs[pos].no};localStorage.setItem(KEY,JSON.stringify(saved)); if(pos<qs.length-1)pos++; render()}
